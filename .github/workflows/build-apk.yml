name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['android/**', '.github/workflows/build-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ensure Android SDK packages
        run: yes | $(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | head -1) "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: habit-checkin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
